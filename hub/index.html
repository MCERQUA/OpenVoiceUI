<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f5f6">
<title>JamDash — your business, one place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23ffd552'/><text x='50' y='68' font-size='54' font-family='sans-serif' font-weight='bold' fill='%23131416' text-anchor='middle'>J</text></svg>">
</head>
<body>

<div class="app">

  <!-- ===== rail : rendered from nav.js, never hand-written ===== -->
  <nav class="rail" id="rail" aria-label="Main">
    <div class="rail__brand">
      <div class="rail__mark">JB</div>
      <div>
        <div class="rail__name">JamDash</div>
        <div class="rail__sub" id="railTenant">demo workspace</div>
      </div>
    </div>
    <div class="rail__scroll" id="railNav"></div>
    <div class="rail__foot">
      <a class="navlink" href="#/account/help"><span class="material-symbols-outlined">help</span>Help</a>
    </div>
  </nav>

  <div class="scrim" id="scrim"></div>

  <!-- ===== topbar ===== -->
  <header class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="Menu"><span class="material-symbols-outlined">menu</span></button>
    <div class="topbar__search">
      <span class="material-symbols-outlined">search</span>
      <input type="search" placeholder="Search everything…" aria-label="Search">
    </div>
    <div style="flex:1"></div>
    <div class="tenantchip">
      <span class="material-symbols-outlined" style="font-size:18px">storefront</span>
      <select id="tenantSel" aria-label="Workspace">
        <option>Demo Insulation Co.</option>
      </select>
    </div>
    <button class="iconbtn" aria-label="Notifications">
      <span class="material-symbols-outlined">notifications</span><span class="iconbtn__dot"></span>
    </button>
    <div class="avatar">AD</div>
  </header>

  <!-- ===== the one mount point ===== -->
  <main class="main"><div class="page" id="view"></div></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
