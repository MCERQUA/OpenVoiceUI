name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# SEC-056 least privilege: the job only checks out and reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 10 min fit the suite before #595 (~1.5 min). #595 added ~600 CRT pack / probe tests: the full run is now
    # 8.4 min on a fast runner and >10 min on a typical one (main 8001dfe and PR #600 were cancelled at 10:14
    # with no failure). 30 leaves headroom without hiding a real hang for long.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q
