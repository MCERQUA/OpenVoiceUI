// ════════════════════════════════════════════════════════════════
// FOLDER TABS
// ════════════════════════════════════════════════════════════════
function renderFolderTabs() {
  if (!currentAlbum) return;
  const folders = ['All', ...(currentAlbum.folders || [])];
  const tabs = document.getElementById('folderTabs');
  tabs.style.display = '';
  tabs.innerHTML = folders.map(f => {
    const cls = (f === 'All' && activeFolder === null) || f === activeFolder ? 'active' : '';
    return `<button class="folder-tab ${cls}" onclick="selectFolder('${esc(f)}')">${esc(f)}</button>`;
  }).join('');
}

function selectFolder(folder) {
  activeFolder = folder === 'All' ? null : folder;
  filteredPhotos = activeFolder ? albumPhotos.filter(p => p.folder === activeFolder) : [...albumPhotos];
  renderFolderTabs();
  renderPhotoGrid();
}

// ════════════════════════════════════════════════════════════════
// PHOTO GRID
// ════════════════════════════════════════════════════════════════
function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const empty = document.getElementById('emptyState');
  const secLbl = document.getElementById('sectionLbl');
  if (filteredPhotos.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    secLbl.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  secLbl.style.display = 'flex';
  document.getElementById('sectionTitle').textContent = activeFolder || 'All Photos';
  document.getElementById('sectionCount').textContent = filteredPhotos.length;
  grid.innerHTML = filteredPhotos.map((p, i) => {
    const thumbUrl = `${API}/albums/${currentAlbum.id}/thumb/${p.id}`;
    const caption = p.ai_caption || '';
    const selCls = selectedIds.has(p.id) ? ' selected' : '';
    return `<div class="photo-card${batchMode ? ' selectable' : ''}${selCls}" data-pid="${esc(p.id)}" data-caption="${esc(caption)}"
      oncontextmenu="event.preventDefault();startSelectAt(${i})"
      ontouchstart="photoTouchStart(event,${i})" ontouchend="photoTouchEnd(event,${i})" ontouchmove="photoTouchMove(event)"
      onclick="photoClick(${i})">
      <div class="photo-card-select" onclick="event.stopPropagation();toggleSelect('${esc(p.id)}')"></div>
      <img class="photo-card-img" src="${esc(thumbUrl)}" alt="" loading="lazy" onerror="this.style.background='var(--bg2)'">
      ${p.folder ? `<div class="photo-card-folder">${esc(p.folder)}</div>` : ''}
      <div class="photo-card-caption">${esc(caption.slice(0, 30))}${caption.length > 30 ? '...' : ''}</div>
    </div>`;
  }).join('');
}

function photoTouchStart(e, idx) {
  longPressTimer = setTimeout(() => {
    if (!batchMode) {
      batchMode = true;
      selectedIds.clear();
      renderPhotoGrid();
    }
    toggleSelect(filteredPhotos[idx].id);
    e.preventDefault();
  }, 500);
}

function photoTouchMove() {
  clearTimeout(longPressTimer);
}

function photoTouchEnd(e, idx) {
  clearTimeout(longPressTimer);
}

function photoClick(idx) {
  if (batchMode) {
    toggleSelect(filteredPhotos[idx].id);
    return;
  }
  openViewer(filteredPhotos, idx);
}

function startSelectAt(idx) {
  if (!batchMode) {
    batchMode = true;
    selectedIds.clear();
  }
  toggleSelect(filteredPhotos[idx].id);
  renderPhotoGrid();
}

function toggleSelect(pid) {
  if (selectedIds.has(pid)) selectedIds.delete(pid);
  else selectedIds.add(pid);
  updateBatchBar();
  renderPhotoGrid();
}

function cancelBatch() {
  batchMode = false;
  selectedIds.clear();
  document.getElementById('batchBar').classList.remove('show');
  renderPhotoGrid();
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  if (selectedIds.size === 0 && batchMode) {
    cancelBatch();
    return;
  }
  bar.classList.add('show');
  document.getElementById('batchCt').textContent = `${selectedIds.size} selected`;
}

// ════════════════════════════════════════════════════════════════
// BATCH OPERATIONS
// ════════════════════════════════════════════════════════════════
async function batchTag() {
  const tag = prompt('Enter tag to add to all selected photos:');
  if (!tag || !currentAlbum) return;
  toast('spin', 'Tagging...');
  let ok = 0;
  for (const pid of selectedIds) {
    const p = albumPhotos.find(x => x.id === pid);
    if (!p) continue;
    if (!p.tags) p.tags = [];
    if (!p.tags.includes(tag)) p.tags.push(tag);
    try {
      await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tags: p.tags })
      });
      ok++;
    } catch { /* skip */ }
  }
  toast('ok', `Tagged ${ok} photo${ok === 1 ? '' : 's'}`);
  cancelBatch();
}

async function batchMove() {
  const folders = currentAlbum ? (currentAlbum.folders || []) : [];
  const target = prompt(`Move to folder:\n${folders.join(', ')}\n\nType folder name:`);
  if (!target || !currentAlbum) return;
  toast('spin', 'Moving...');
  let ok = 0;
  for (const pid of selectedIds) {
    try {
      await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: target })
      });
      const p = albumPhotos.find(x => x.id === pid);
      if (p) p.folder = target;
      ok++;
    } catch { /* skip */ }
  }
  toast('ok', `Moved ${ok} photo${ok === 1 ? '' : 's'}`);
  cancelBatch();
  selectFolder(activeFolder);
}

async function batchDescribe() {
  if (!currentAlbum) return;
  toast('spin', 'AI describing...');
  try {
    await apiFetch(`${API}/albums/${currentAlbum.id}/ai/batch-describe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photo_ids: [...selectedIds] })
    });
    // Reload album
    const r = await apiFetch(`${API}/albums/${currentAlbum.id}`);
    if (r.ok) {
      const data = await r.json();
      currentAlbum = data;
      albumPhotos = data.photos || [];
      selectFolder(activeFolder);
    }
    toast('ok', 'AI descriptions complete');
  } catch {
    toast('err', 'AI describe failed');
  }
  cancelBatch();
}

async function batchDelete() {
  const ct = selectedIds.size;
  if (!confirm(`Soft-delete ${ct} photo${ct === 1 ? '' : 's'}?`)) return;
  if (!currentAlbum) return;
  toast('spin', 'Deleting...');
  let ok = 0;
  for (const pid of selectedIds) {
    try {
      await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, { method: 'DELETE' });
      ok++;
    } catch { /* skip */ }
  }
  toast('ok', `Removed ${ok} photo${ok === 1 ? '' : 's'}`);
  cancelBatch();
  // Reload
  const r = await apiFetch(`${API}/albums/${currentAlbum.id}`);
  if (r.ok) {
    const data = await r.json();
    currentAlbum = data;
    albumPhotos = data.photos || [];
    selectFolder(activeFolder);
  }
}

// ════════════════════════════════════════════════════════════════
// ALBUM MODAL (create / edit)
// ════════════════════════════════════════════════════════════════
function openAlbumModal(editId) {
  modalAlbumId = editId || null;
  const modal = document.getElementById('albumModal');
  if (editId && currentAlbum && currentAlbum.id === editId) {
    document.getElementById('albumModalTitle').textContent = 'Edit Album';
    document.getElementById('modalName').value = currentAlbum.name || '';
    document.getElementById('modalClient').value = currentAlbum.client_name || '';
    document.getElementById('modalAddress').value = currentAlbum.address || '';
    document.getElementById('modalLat').value = currentAlbum.lat != null ? currentAlbum.lat : '';
    document.getElementById('modalLng').value = currentAlbum.lng != null ? currentAlbum.lng : '';
    document.getElementById('modalStatus').value = currentAlbum.status || 'in_progress';
    renderModalFolders(currentAlbum.folders || []);
  } else {
    document.getElementById('albumModalTitle').textContent = 'New Album';
    document.getElementById('modalName').value = '';
    document.getElementById('modalClient').value = '';
    document.getElementById('modalAddress').value = '';
    document.getElementById('modalLat').value = '';
    document.getElementById('modalLng').value = '';
    document.getElementById('modalStatus').value = 'in_progress';
    renderModalFolders(['Before', 'During', 'After']);
  }
  modal.classList.add('open');
}

function closeAlbumModal() {
  document.getElementById('albumModal').classList.remove('open');
  modalAlbumId = null;
}

let modalFolders = [];

function renderModalFolders(folders) {
  modalFolders = [...folders];
  const el = document.getElementById('modalFolders');
  el.innerHTML = modalFolders.map((f, i) =>
    `<span class="modal-folder-chip">${esc(f)}<button onclick="removeModalFolder(${i})">&times;</button></span>`
  ).join('') + `<button class="modal-folder-add" onclick="showFolderInput()">+ Add</button>`;
  document.getElementById('modalFolderInput').style.display = 'none';
}

function showFolderInput() {
  const inp = document.getElementById('modalFolderInput');
  inp.style.display = '';
  inp.value = '';
  inp.focus();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('modalFolderInput')) {
    e.preventDefault();
    const val = document.getElementById('modalFolderInput').value.trim();
    if (val && !modalFolders.includes(val)) {
      modalFolders.push(val);
      renderModalFolders(modalFolders);
    }
  }
});

function removeModalFolder(idx) {
  modalFolders.splice(idx, 1);
  renderModalFolders(modalFolders);
}

function fillGPS() {
  if (!gpsPos) { toast('err', 'No GPS fix yet'); return; }
  document.getElementById('modalLat').value = gpsPos.lat;
  document.getElementById('modalLng').value = gpsPos.lng;
}

async function saveAlbumModal() {
  const name = document.getElementById('modalName').value.trim();
  if (!name) { toast('err', 'Name is required'); return; }
  const payload = {
    name,
    client_name: document.getElementById('modalClient').value.trim(),
    address: document.getElementById('modalAddress').value.trim(),
    lat: document.getElementById('modalLat').value ? parseFloat(document.getElementById('modalLat').value) : null,
    lng: document.getElementById('modalLng').value ? parseFloat(document.getElementById('modalLng').value) : null,
    status: document.getElementById('modalStatus').value,
    folders: modalFolders
  };
  try {
    if (modalAlbumId) {
      const r = await apiFetch(`${API}/albums/${modalAlbumId}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (currentAlbum && currentAlbum.id === modalAlbumId) {
        currentAlbum = data;
        renderAlbumInfo();
        renderFolderTabs();
      }
      toast('ok', 'Album updated');
    } else {
      const r = await apiFetch(`${API}/albums`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      toast('ok', 'Album created');
      closeAlbumModal();
      renderAlbumList();
      // Open the new album
      openAlbumDetail(data.id);
      return;
    }
    closeAlbumModal();
  } catch (e) {
    console.error('Album save failed:', e);
    toast('err', 'Save failed');
  }
}

// ════════════════════════════════════════════════════════════════
// CAMERA
// ════════════════════════════════════════════════════════════════
async function startCamera(facing) {
  facing = facing || CAM.facing;
  // Always stop old tracks first
  if (CAM.stream) {
    CAM.stream.getTracks().forEach(t => t.stop());
    CAM.stream = null;
  }
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    CAM.track = CAM.stream.getVideoTracks()[0];
    CAM.facing = facing;
    // Feed both viewfinder and shutter circle
    for (const id of ['viewfinder', 'shutterVideo']) {
      const v = document.getElementById(id);
      if (!v) continue;
      v.srcObject = CAM.stream;
      v.muted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      try { await v.play(); } catch { /* autoplay blocked, ok */ }
    }
  } catch (e) {
    console.warn('Camera access failed:', e);
  }
}

function stopCamera() {
  if (CAM.stream) {
    CAM.stream.getTracks().forEach(t => t.stop());
    CAM.stream = null;
    CAM.track = null;
  }
  const vf = document.getElementById('viewfinder');
  const sv = document.getElementById('shutterVideo');
  if (vf) vf.srcObject = null;
  if (sv) sv.srcObject = null;
  window.parent.postMessage({ type: 'canvas-action', action: 'camera-release' }, '*');
}

function flipCamera() {
  const newFacing = CAM.facing === 'environment' ? 'user' : 'environment';
  startCamera(newFacing);
}

function toggleFlash() {
  if (!CAM.track) return;
  const caps = CAM.track.getCapabilities ? CAM.track.getCapabilities() : {};
  if (!caps.torch) return;
  CAM.flash = !CAM.flash;
  CAM.track.applyConstraints({ advanced: [{ torch: CAM.flash }] }).catch(() => {});
  document.getElementById('camFlash').classList.toggle('active', CAM.flash);
}

function toggleGrid() {
  CAM.gridOn = !CAM.gridOn;
  document.getElementById('camGridOverlay').classList.toggle('show', CAM.gridOn);
  document.getElementById('camGrid').classList.toggle('active', CAM.gridOn);
}

function cycleTimer() {
  const options = [0, 3, 10];
  const curIdx = options.indexOf(CAM.timerSec);
  CAM.timerSec = options[(curIdx + 1) % options.length];
  const btn = document.getElementById('camTimer');
  btn.classList.toggle('active', CAM.timerSec > 0);
  // Update label
  document.getElementById('camTimerDisplay').textContent = CAM.timerSec > 0 ? `${CAM.timerSec}` : '';
}

function openCameraOverlay() {
  document.getElementById('cameraOverlay').classList.add('open');
  startCamera(CAM.facing);
  cameraActive = true;
}

function closeCameraOverlay() {
  document.getElementById('cameraOverlay').classList.remove('open');
  cameraActive = false;
  // Don't stop camera — keep feed for shutter preview
}

// Shutter interaction
function onShutterTouchStart(e) {
  e.preventDefault();
  CAM.holdTimer = setTimeout(() => {
    // Hold >= 400ms — start video recording
    CAM.recording = true;
    document.getElementById('camShutter').classList.add('recording');
    document.getElementById('camShutterLabel').textContent = 'Recording...';
  }, 400);
}

document.addEventListener('mouseup', onShutterRelease);
document.addEventListener('touchend', onShutterRelease);

async function onShutterRelease(e) {
  if (!CAM.holdTimer) return;
  clearTimeout(CAM.holdTimer);
  CAM.holdTimer = null;

  if (CAM.recording) {
    CAM.recording = false;
    document.getElementById('camShutter').classList.remove('recording');
    document.getElementById('camShutterLabel').textContent = 'Photo';
    toast('ok', 'Video recording saved');
    return;
  }

  // Still photo — possibly with timer
  if (CAM.timerSec > 0) {
    await runTimer(CAM.timerSec);
  }
  await captureStill();
}

async function runTimer(seconds) {
  const display = document.getElementById('camTimerDisplay');
  display.style.display = '';
  for (let i = seconds; i > 0; i--) {
    display.textContent = i;
    await new Promise(r => setTimeout(r, 1000));
  }
  display.style.display = 'none';
}

async function captureStill() {
  if (!CAM.stream || !CAM.track) return;
  const t0 = new Date().toISOString();
  const snapGps = gpsPos ? { ...gpsPos } : null;
  let blob;
  // Fast path (Chrome/Android with ImageCapture)
  if (window.ImageCapture && CAM.track.readyState === 'live') {
    try {
      blob = await new ImageCapture(CAM.track).takePhoto({ imageWidth: 4096 });
    } catch { /* fall through */ }
  }
  // Universal path (iOS/Safari)
  if (!blob) {
    const v = document.getElementById('viewfinder');
    const c = document.createElement('canvas');
    c.width = v.videoWidth || 1920;
    c.height = v.videoHeight || 1080;
    c.getContext('2d', { alpha: false }).drawImage(v, 0, 0, c.width, c.height);
    blob = await new Promise((resolve, reject) => {
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92);
    });
  }
  flashShutter();
  try { navigator.vibrate?.(15); } catch { /* ignore */ }

  if (!currentAlbum) {
    toast('err', 'No album selected');
    return;
  }

  const folder = activeFolder || (currentAlbum.folders || [])[0] || 'Before';
  const formData = new FormData();
  formData.append('file', blob, `capture_${Date.now()}.jpg`);
  formData.append('captured_at', t0);
  if (snapGps) {
    formData.append('lat', snapGps.lat);
    formData.append('lng', snapGps.lng);
    formData.append('gps_accuracy_m', snapGps.acc);
  }
  formData.append('folder', folder);
  formData.append('client_uuid', `${Date.now()}_${Math.random().toString(36).slice(2,8)}`);
  formData.append('seq', String(Date.now()));

  // Show uploading ring
  const ring = document.getElementById('captureRing');
  ring.classList.add('uploading');
  toast('spin', 'Uploading...');

  try {
    const r = await apiFetch(`${API}/albums/${currentAlbum.id}/photos`, { method: 'POST', body: formData });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const photo = await r.json();
    albumPhotos.push(photo);
    filteredPhotos = activeFolder ? albumPhotos.filter(p => p.folder === activeFolder) : [...albumPhotos];
    renderPhotoGrid();
    document.getElementById('backCount').textContent = `${albumPhotos.length} photo${albumPhotos.length === 1 ? '' : 's'}`;
    toast('ok', 'Photo captured');
  } catch (e) {
    console.error('Upload failed:', e);
    toast('err', 'Upload failed');
  }
  ring.classList.remove('uploading');
}

function flashShutter() {
  const flash = document.getElementById('shutterFlash');
  const circle = document.getElementById('captureCircle');
  const ring = document.getElementById('captureRing');
  const fg = ring.querySelector('.ring-fg');

  // Flash overlay
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity 0.25s ease-out';
    flash.style.opacity = '0';
  });

  // Circle scale pulse
  circle.style.transition = 'transform 0.09s ease-out';
  circle.style.transform = 'translate(-50%,-50%) scale(0.92)';
  setTimeout(() => {
    circle.style.transition = 'transform 0.15s ease';
    circle.style.transform = 'translate(-50%,-50%) scale(1)';
  }, 90);

  // Ring flash
  fg.style.transition = 'none';
  fg.style.strokeDashoffset = '0';
  setTimeout(() => {
    fg.style.transition = 'stroke-dashoffset 0.4s ease-out';
    fg.style.strokeDashoffset = '301.59';
  }, 50);
}

// ════════════════════════════════════════════════════════════════
// FULL-SCREEN VIEWER
// ════════════════════════════════════════════════════════════════
function openViewer(photos, idx) {
  viewerPhotos = photos;
  viewerIdx = idx;
  viewerZoom = 1;
  viewerPanX = 0;
  viewerPanY = 0;
  viewerShowingBefore = false;
  populateViewer();
  document.getElementById('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
  setupViewerTouch();
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  document.body.style.overflow = '';
  teardownViewerTouch();
}

function viewerNav(dir) {
  const ni = viewerIdx + dir;
  if (ni < 0 || ni >= viewerPhotos.length) return;
  viewerIdx = ni;
  viewerZoom = 1;
  viewerPanX = 0;
  viewerPanY = 0;
  viewerShowingBefore = false;
  populateViewer();
}

function populateViewer() {
  const p = viewerPhotos[viewerIdx];
  if (!p || !currentAlbum) return;
  const imgUrl = viewerShowingBefore && p.pair_before_id
    ? `${API}/albums/${currentAlbum.id}/media/${p.pair_before_id}`
    : `${API}/albums/${currentAlbum.id}/media/${p.id}`;
  document.getElementById('viewerImg').src = imgUrl;
  document.getElementById('viewerCounter').textContent = `${viewerIdx + 1} / ${viewerPhotos.length}`;
  document.getElementById('viewerPrev').style.opacity = viewerIdx === 0 ? '.3' : '1';
  document.getElementById('viewerNext').style.opacity = viewerIdx === viewerPhotos.length - 1 ? '.3' : '1';

  // Before/After toggle visibility
  const baBtn = document.getElementById('viewerBaToggle');
  baBtn.classList.toggle('show', !!p.pair_before_id);
  baBtn.textContent = viewerShowingBefore ? 'Showing Before' : 'Before / After';

  // Reset transform
  const img = document.getElementById('viewerImg');
  img.style.transform = `scale(1) translate(0px, 0px)`;

  // Bottom sheet content
  renderViewerSheet(p);
}

function toggleBeforeAfter() {
  viewerShowingBefore = !viewerShowingBefore;
  populateViewer();
}

function renderViewerSheet(p) {
  const sheetContent = document.getElementById('viewerSheetContent');
  const tags = p.tags || [];
  const gpsLink = p.lat != null ? `https://maps.google.com/?q=${p.lat},${p.lng}` : '';
  const ts = p.captured_at ? new Date(p.captured_at) : null;
  const tsStr = ts ? ts.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const folder = p.folder || '';

  sheetContent.innerHTML = `
    ${p.lat != null ? `<div class="viewer-section">
      <div class="viewer-section-lbl">Location</div>
      <div class="viewer-gps">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}${p.gps_accuracy_m ? ` (±${p.gps_accuracy_m}m)` : ''}
        ${gpsLink ? ` &middot; <a href="${gpsLink}" target="_blank" rel="noopener">Open in Maps</a>` : ''}
      </div>
    </div>` : ''}
    ${tsStr ? `<div class="viewer-section"><div class="viewer-section-lbl">Captured</div><div class="viewer-ts">${tsStr}</div></div>` : ''}
    ${folder ? `<div class="viewer-section"><div class="viewer-section-lbl">Folder</div><div style="font-size:.82rem;color:var(--tx)">${esc(folder)}</div></div>` : ''}
    <div class="viewer-section">
      <div class="viewer-section-lbl">Tags</div>
      <div class="viewer-tags">
        ${tags.map((t, i) => `<span class="viewer-tag">${esc(t)}<button onclick="removeViewerTag('${esc(p.id)}',${i})">&times;</button></span>`).join('')}
        <span class="viewer-tag-add" onclick="showViewerTagInput()">+ Tag</span>
      </div>
      <div class="viewer-tag-input" id="vTagInput">
        <input type="text" placeholder="Add tag..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addViewerTag('${esc(p.id)}')}">
        <button onclick="addViewerTag('${esc(p.id)}')">Add</button>
      </div>
    </div>
    <div class="viewer-section">
      <div class="viewer-section-lbl">Note</div>
      <textarea class="viewer-note" id="vNote" placeholder="Add a note..." onblur="saveViewerNote('${esc(p.id)}')">${esc(p.note || '')}</textarea>
    </div>
    <div class="viewer-actions">
      <button class="v-btn ai" onclick="viewerAiDescribe('${esc(p.id)}')">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        AI Analyze
      </button>
      <button class="v-btn annotate" onclick="openAnnotator('${esc(p.id)}')">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        Annotate
      </button>
      <button class="v-btn del" onclick="viewerDelete('${esc(p.id)}')">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/></svg>
        Delete
      </button>
    </div>`;
}

function toggleViewerSheet() {
  document.getElementById('viewerSheet').classList.toggle('collapsed');
}

// Viewer tag operations
function showViewerTagInput() {
  document.getElementById('vTagInput').classList.toggle('show');
}

async function addViewerTag(pid) {
  const input = document.querySelector('#vTagInput input');
  const tag = input.value.trim();
  if (!tag || !currentAlbum) return;
  input.value = '';
  document.getElementById('vTagInput').classList.remove('show');
  const p = albumPhotos.find(x => x.id === pid);
  if (!p) return;
  if (!p.tags) p.tags = [];
  if (!p.tags.includes(tag)) p.tags.push(tag);
  try {
    await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tags: p.tags })
    });
    renderViewerSheet(p);
  } catch { toast('err', 'Tag update failed'); }
}

async function removeViewerTag(pid, idx) {
  if (!currentAlbum) return;
  const p = albumPhotos.find(x => x.id === pid);
  if (!p || !p.tags) return;
  p.tags.splice(idx, 1);
  try {
    await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tags: p.tags })
    });
    renderViewerSheet(p);
  } catch { toast('err', 'Tag update failed'); }
}

async function saveViewerNote(pid) {
  if (!currentAlbum) return;
  const note = document.getElementById('vNote').value;
  const p = albumPhotos.find(x => x.id === pid);
  if (!p) return;
  if (p.note === note) return;
  p.note = note;
  try {
    await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note })
    });
    toast('ok', 'Note saved');
  } catch { toast('err', 'Save failed'); }
}

async function viewerAiDescribe(pid) {
  if (!currentAlbum) return;
  toast('spin', 'Analyzing...');
  try {
    const r = await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}/describe`, { method: 'POST' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const p = albumPhotos.find(x => x.id === pid);
    if (p) {
      p.ai_caption = data.ai_caption || data.caption || '';
      if (data.tags) p.tags = [...new Set([...(p.tags || []), ...data.tags])];
      renderViewerSheet(p);
      renderPhotoGrid();
    }
    toast('ok', 'Analysis complete');
  } catch {
    toast('err', 'Analysis failed');
  }
}

async function viewerDelete(pid) {
  if (!confirm('Remove this photo?')) return;
  if (!currentAlbum) return;
  try {
    await apiFetch(`${API}/albums/${currentAlbum.id}/photos/${pid}`, { method: 'DELETE' });
    const newPhotos = albumPhotos.filter(x => x.id !== pid);
    albumPhotos = newPhotos;
    filteredPhotos = activeFolder ? albumPhotos.filter(p => p.folder === activeFolder) : [...albumPhotos];
    if (viewerPhotos.length > 1) {
      viewerPhotos = filteredPhotos;
      viewerIdx = Math.min(viewerIdx, viewerPhotos.length - 1);
      populateViewer();
    } else {
      closeViewer();
    }
    renderPhotoGrid();
    document.getElementById('backCount').textContent = `${albumPhotos.length} photo${albumPhotos.length === 1 ? '' : 's'}`;
    toast('ok', 'Photo removed');
  } catch { toast('err', 'Delete failed'); }
}

function openViewerLast() {
  if (filteredPhotos.length === 0) return;
  openViewer(filteredPhotos, filteredPhotos.length - 1);
}

// Viewer swipe/zoom touch
let vTouchStartX = 0, vTouchStartY = 0, vTouchDist = 0, vTouchDragging = false;

function setupViewerTouch() {
  const wrap = document.getElementById('viewerWrap');
  wrap.addEventListener('touchstart', viewerTouchStart, { passive: true });
  wrap.addEventListener('touchmove', viewerTouchMove, { passive: false });
  wrap.addEventListener('touchend', viewerTouchEnd, { passive: true });
}

function teardownViewerTouch() {
  const wrap = document.getElementById('viewerWrap');
  wrap.removeEventListener('touchstart', viewerTouchStart);
  wrap.removeEventListener('touchmove', viewerTouchMove);
  wrap.removeEventListener('touchend', viewerTouchEnd);
}

function viewerTouchStart(e) {
  if (e.touches.length === 1) {
    vTouchStartX = e.touches[0].clientX;
    vTouchStartY = e.touches[0].clientY;
    vTouchDragging = true;
  } else if (e.touches.length === 2) {
    vTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}

function viewerTouchMove(e) {
  if (e.touches.length === 2 && vTouchDist > 0) {
    e.preventDefault();
    const newDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const scale = newDist / vTouchDist;
    viewerZoom = Math.max(0.5, Math.min(5, viewerZoom * scale));
    vTouchDist = newDist;
    applyViewerTransform();
  }
}

function viewerTouchEnd(e) {
  if (vTouchDragging && e.changedTouches.length === 1 && viewerZoom <= 1.05) {
    const dx = e.changedTouches[0].clientX - vTouchStartX;
    if (Math.abs(dx) > 60) {
      if (dx > 0) viewerNav(-1); else viewerNav(1);
    }
  }
  vTouchDragging = false;
  vTouchDist = 0;
}

function applyViewerTransform() {
  const img = document.getElementById('viewerImg');
  img.style.transform = `scale(${viewerZoom}) translate(${viewerPanX}px, ${viewerPanY}px)`;
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const viewer = document.getElementById('viewer');
  if (!viewer.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') viewerNav(-1);
  if (e.key === 'ArrowRight') viewerNav(1);
  if (e.key === 'Escape') closeViewer();
});

// ════════════════════════════════════════════════════════════════
// ANNOTATION CANVAS
// ════════════════════════════════════════════════════════════════
function setupAnnotator() {
  anCanvas = document.getElementById('annotCanvas');
  anCtx = anCanvas.getContext('2d');
  const c = anCanvas;

  function getPos(e) {
    const rect = c.getBoundingClientRect();
    const sx = c.width / rect.width;
    const sy = c.height / rect.height;
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - rect.left) * sx, y: (t.clientY - rect.top) * sy };
  }

  function down(e) {
    if (anTool === 'text') { handleAnTextClick(e); return; }
    if (anTool !== 'pen' && anTool !== 'erase') return;
    e.preventDefault();
    anDrawing = true;
    const pos = getPos(e);
    anCtx.beginPath();
    anCtx.moveTo(pos.x, pos.y);
    setAnDrawStyle();
  }
  function move(e) {
    if (!anDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    anCtx.lineTo(pos.x, pos.y);
    anCtx.stroke();
  }
  function up() {
    if (!anDrawing) return;
    anDrawing = false;
    anCtx.closePath();
    anSaveSnapshot();
  }

  c.addEventListener('mousedown', down);
  c.addEventListener('mousemove', move);
  c.addEventListener('mouseup', up);
  c.addEventListener('mouseleave', up);
  c.addEventListener('touchstart', down, { passive: false });
  c.addEventListener('touchmove', move, { passive: false });
  c.addEventListener('touchend', up);

  document.getElementById('anTextInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitAnText(); }
    if (e.key === 'Escape') { document.getElementById('anTextWrap').classList.remove('show'); anPendingTextPos = null; }
  });
  document.getElementById('anTextInput').addEventListener('blur', () => {
    if (anPendingTextPos) commitAnText();
  });
}

function openAnnotator(pid) {
  if (!currentAlbum) return;
  anPhotoId = pid;
  anAlbumId = currentAlbum.id;
  anUndoStack = [];
  anTool = 'pen';
  updateAnToolUI();
  document.getElementById('anTextWrap').classList.remove('show');
  anPendingTextPos = null;

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    anBaseImage = img;
    const wrap = document.getElementById('anCanvasWrap');
    const maxW = wrap.clientWidth || 400;
    const maxH = wrap.clientHeight || 600;
    const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    anCanvas.width = Math.round(img.naturalWidth * scale);
    anCanvas.height = Math.round(img.naturalHeight * scale);
    anCtx.drawImage(img, 0, 0, anCanvas.width, anCanvas.height);
    anSaveSnapshot();
  };
  img.onerror = () => toast('err', 'Could not load image');
  img.src = `${API}/albums/${anAlbumId}/media/${pid}?t=${Date.now()}`;
  document.getElementById('annotOverlay').classList.add('open');
}

function closeAnnotator() {
  document.getElementById('annotOverlay').classList.remove('open');
  document.getElementById('anTextWrap').classList.remove('show');
  anPendingTextPos = null;
}

function anSetTool(tool) {
  anTool = tool;
  document.getElementById('anCanvasWrap').setAttribute('data-tool', tool);
  updateAnToolUI();
  document.getElementById('anTextWrap').classList.remove('show');
  anPendingTextPos = null;
}

function updateAnToolUI() {
  document.getElementById('anPen').classList.toggle('active', anTool === 'pen');
  document.getElementById('anText').classList.toggle('active', anTool === 'text');
  document.getElementById('anErase').classList.toggle('active', anTool === 'erase');
  document.getElementById('anCanvasWrap').setAttribute('data-tool', anTool);
}

function anSetColor(val) {
  document.getElementById('anColorSwatch').style.background = val;
}

function anSaveSnapshot() {
  anUndoStack.push(anCtx.getImageData(0, 0, anCanvas.width, anCanvas.height));
  if (anUndoStack.length > 30) anUndoStack.shift();
}

function anUndo() {
  if (anUndoStack.length <= 1) return;
  anUndoStack.pop();
  anCtx.putImageData(anUndoStack[anUndoStack.length - 1], 0, 0);
}

function setAnDrawStyle() {
  const color = document.getElementById('anColor').value;
  const size = parseInt(document.getElementById('anSize').value);
  if (anTool === 'erase') {
    anCtx.globalCompositeOperation = 'destination-out';
    anCtx.strokeStyle = 'rgba(0,0,0,1)';
    anCtx.lineWidth = size * 3;
  } else {
    anCtx.globalCompositeOperation = 'source-over';
    anCtx.strokeStyle = color;
    anCtx.lineWidth = size;
  }
  anCtx.lineCap = 'round';
  anCtx.lineJoin = 'round';
}

function handleAnTextClick(e) {
  e.preventDefault();
  const rect = anCanvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  const sx = anCanvas.width / rect.width;
  const sy = anCanvas.height / rect.height;
  anPendingTextPos = {
    x: (t.clientX - rect.left) * sx,
    y: (t.clientY - rect.top) * sy,
    screenX: t.clientX - rect.left,
    screenY: t.clientY - rect.top
  };
  const wrap = document.getElementById('anCanvasWrap');
  const wRect = wrap.getBoundingClientRect();
  const cRect = anCanvas.getBoundingClientRect();
  let tx = cRect.left - wRect.left + anPendingTextPos.screenX;
  let ty = cRect.top - wRect.top + anPendingTextPos.screenY - 20;
  tx = Math.max(0, Math.min(tx, wRect.width - 200));
  ty = Math.max(0, Math.min(ty, wRect.height - 50));
  const tw = document.getElementById('anTextWrap');
  tw.style.left = tx + 'px';
  tw.style.top = ty + 'px';
  const inp = document.getElementById('anTextInput');
  inp.value = '';
  tw.classList.add('show');
  setTimeout(() => inp.focus(), 50);
}

function commitAnText() {
  const inp = document.getElementById('anTextInput');
  const txt = inp.value.trim();
  document.getElementById('anTextWrap').classList.remove('show');
  if (!txt || !anPendingTextPos) { anPendingTextPos = null; return; }
  const color = document.getElementById('anColor').value;
  const size = parseInt(document.getElementById('anSize').value);
  anCtx.globalCompositeOperation = 'source-over';
  anCtx.font = `bold ${Math.max(14, size * 3)}px system-ui, sans-serif`;
  anCtx.fillStyle = color;
  anCtx.strokeStyle = 'rgba(0,0,0,0.6)';
  anCtx.lineWidth = 1.5;
  anCtx.strokeText(txt, anPendingTextPos.x, anPendingTextPos.y);
  anCtx.fillText(txt, anPendingTextPos.x, anPendingTextPos.y);
  anPendingTextPos = null;
  inp.value = '';
  anSaveSnapshot();
}

async function saveAnnotation() {
  if (!anAlbumId || !anPhotoId) return;
  toast('spin', 'Saving annotation...');
  try {
    const blob = await new Promise((resolve, reject) => {
      anCanvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', 0.92);
    });
    const formData = new FormData();
    formData.append('annotation', blob, `annot_${anPhotoId}.jpg`);
    const r = await apiFetch(`${API}/albums/${anAlbumId}/photos/${anPhotoId}/annotate`, { method: 'POST', body: formData });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    // Update local state
    const p = albumPhotos.find(x => x.id === anPhotoId);
    if (p) p.annotated = true;
    toast('ok', 'Annotation saved');
    closeAnnotator();
  } catch (e) {
    console.error('Annotation save failed:', e);
    toast('err', 'Save failed');
  }
}

// ════════════════════════════════════════════════════════════════
// LEVEL INDICATOR (device orientation)
// ════════════════════════════════════════════════════════════════
function setupLevel() {
  if (!window.DeviceOrientationEvent) return;
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    const angle = e.gamma;
    const inner = document.getElementById('camLevelInner');
    if (!inner) return;
    const rotation = Math.max(-45, Math.min(45, angle));
    inner.style.transform = `rotate(${rotation}deg) scaleX(${Math.abs(rotation) < 3 ? 1 : 0.6})`;
    inner.classList.toggle('level', Math.abs(angle) < 2);
  });
}

// ════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(type, msg) {
  const el = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const msgEl = document.getElementById('toastMsg');
  const paths = {
    spin: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
    err: '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>'
  };
  el.className = `toast show ${type}`;
  icon.innerHTML = paths[type] || paths.spin;
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  if (type !== 'spin') toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ════════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════
setupLevel();
init();
</script>
